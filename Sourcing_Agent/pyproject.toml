[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcing1688"
version = "1.0.0"
description = "Personalised 1688 apparel sourcing agent, exposed to any AI over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # Works on both major SDK lines: 2.0 renamed FastMCP to MCPServer and the
    # server module shims over the difference.
    "mcp>=1.13",
]

[project.optional-dependencies]
http = ["uvicorn>=0.30", "starlette>=0.37"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
sourcing1688 = "sourcing1688.mcp_server:main"
sourcing1688-cli = "sourcing1688.cli:main"

[tool.setuptools.packages.find]
include = ["sourcing1688*"]

[tool.setuptools.package-data]
sourcing1688 = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
